# This is a Declarative Automation Bundle definition for retailq_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: retailq_dab
  uuid: 446254ad-fbd1-43f1-8052-769d2b6c42f1

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The Unity Catalog catalog for all pipeline and notebook resources
  schema:
    description: >-
      Reserved for future use. Data-layer schemas (retail_silver, postgres_bronze,
      saleforce_bronze) are hardcoded in the resource YAMLs by design — they
      represent data layers, not environments. The catalog variable is the
      primary environment separator.
  job_name:
    description: Full display name for the end-to-end orchestration job
  dashboard_id:
    description: >-
      UUID of the dashboard to refresh in the Business_Insights_Dashboard task.
      Must be set to a valid dashboard UUID before deploying the target.

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f3c7de2b-35f6.cloud.databricks.com
    variables:
      catalog: retail_q_dab_dev
      schema: ${workspace.current_user.short_name}
      job_name: "RetailQ End to End Job - DAB Dev"
      dashboard_id: 01f1c30de7af169cb2e0e236050b29fb
  prod:
    # Production target — PREPARED but NOT deployed or runtime-validated.
    # The catalog, schemas, and connection names must be verified against
    # the production workspace before deployment. The dashboard_id must be
    # set to a production dashboard UUID (the dev dashboard is not reused).
    # Do NOT run `databricks bundle deploy -t prod` without explicit approval.
    mode: production
    workspace:
      host: https://dbc-f3c7de2b-35f6.cloud.databricks.com
      root_path: /Workspace/Users/sankeshwarisahil2003@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_q
      schema: prod
      job_name: "RetailQ End to End Job"
      dashboard_id: ""  # TODO: set to a production dashboard UUID before deploying
    permissions:
      - user_name: sankeshwarisahil2003@gmail.com
        level: CAN_MANAGE
