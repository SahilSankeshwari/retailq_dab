[project]
name = "retailq_dab"
version = "0.0.1"
authors = [{ name = "sankeshwarisahil2003@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
]

[project.scripts]
main = "retailq_dab.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120

target-version = "py312"

# Databricks runtime injects `spark` (SparkSession) and `dbutils`
# (Databricks Utilities) as global built-in names in both notebooks
# and Spark Declarative Pipeline (SDP) Python files. Declaring them
# here prevents ruff F821 "undefined name" false positives without
# adding runtime imports that would break in the Databricks environment.
builtins = ["spark", "dbutils"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Notebook cells routinely define widgets before importing modules;
# E402 (module-level import not at top of file) is a false positive there.
"*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
