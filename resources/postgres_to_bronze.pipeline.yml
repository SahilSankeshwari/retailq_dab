resources:
  pipelines:
    postgres_to_bronze:
      name: postgres_to_bronze
      catalog: retail_q_dab_dev
      channel: PREVIEW
      ingestion_definition:
        connection_name: neon_postgres_retail_project
        objects:
          - table:
              destination_catalog: retail_q_dab_dev
              destination_schema: postgres_bronze
              source_catalog: neondb
              source_schema: public
              source_table: inventory
              table_configuration:
                primary_keys:
                  - inventory_id
                query_based_connector_config:
                  cursor_columns:
                    - last_stock_update
          - table:
              destination_catalog: retail_q_dab_dev
              destination_schema: postgres_bronze
              source_catalog: neondb
              source_schema: public
              source_table: product_catalog
              table_configuration:
                primary_keys:
                  - product_id
                query_based_connector_config:
                  cursor_columns:
                    - updated_at
                scd_type: SCD_TYPE_2
        source_type: POSTGRESQL
      notifications:
        - alerts:
            - on-update-fatal-failure
          email_recipients:
            - sankeshwarisahil2003@gmail.com
      schema: postgres_bronze
