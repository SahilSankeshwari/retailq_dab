
name: RetailQ CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest --noconftest -c pytest-unit.ini unit_tests -v

      - name: Check code quality
        run: uv run ruff check src/ unit_tests/ tests/

      - name: Check formatting
        run: uv run ruff format --check src/ unit_tests/ tests/
