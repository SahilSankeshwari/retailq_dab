name: RetailQ CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest --noconftest -c pytest-unit.ini unit_tests -v

      - name: Check code quality
        run: uv run ruff check unit_tests

      - name: Check formatting
        run: uv run ruff format --check unit_tests
       

